<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>

  <!-- Center node -->
  <rect x="245" y="15" width="150" height="45" rx="10" fill="#1a73e8"/>
  <text x="320" y="43" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Threat Actors</text>

  <line x1="320" y1="60" x2="90"  y2="130" stroke="#1a73e8" stroke-width="2"/>
  <line x1="320" y1="60" x2="320" y2="130" stroke="#1a73e8" stroke-width="2"/>
  <line x1="320" y1="60" x2="550" y2="130" stroke="#1a73e8" stroke-width="2"/>

  <!-- APT -->
  <rect x="15" y="130" width="150" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="90" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#174ea6">Advanced Persistent</text>
  <text x="90" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#174ea6">Threats</text>
  <text x="90" y="195" text-anchor="middle" font-size="11" fill="#5f6368">Research targets, stay hidden</text>

  <!-- Insider -->
  <rect x="245" y="130" width="150" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="320" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#174ea6">Insider Threats</text>
  <text x="320" y="184" text-anchor="middle" font-size="11" fill="#5f6368">Abuse authorized access</text>
  <text x="320" y="199" text-anchor="middle" font-size="11" fill="#5f6368">(sabotage, espionage, leaks)</text>

  <!-- Hacktivist -->
  <rect x="475" y="130" width="150" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="550" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#174ea6">Hacktivists</text>
  <text x="550" y="184" text-anchor="middle" font-size="11" fill="#5f6368">Driven by a political</text>
  <text x="550" y="199" text-anchor="middle" font-size="11" fill="#5f6368">or social agenda</text>

  <!-- Hacker types row -->
  <text x="320" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">Hacker Types</text>
  <rect x="30"  y="255" width="180" height="35" rx="6" fill="#174ea6"/>
  <text x="120" y="278" text-anchor="middle" font-size="12" fill="#ffffff">Authorized (Ethical)</text>

  <rect x="230" y="255" width="180" height="35" rx="6" fill="#174ea6"/>
  <text x="320" y="278" text-anchor="middle" font-size="12" fill="#ffffff">Semi-authorized</text>

  <rect x="430" y="255" width="180" height="35" rx="6" fill="#174ea6"/>
  <text x="520" y="278" text-anchor="middle" font-size="12" fill="#ffffff">Unauthorized (Unethical)</text>
</svg>
