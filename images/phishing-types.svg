<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="700" height="380" fill="#ffffff"/>

  <!-- Center node -->
  <rect x="290" y="20" width="120" height="50" rx="10" fill="#1a73e8"/>
  <text x="350" y="52" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">Phishing</text>

  <!-- Branch lines -->
  <line x1="350" y1="70" x2="70"  y2="150" stroke="#1a73e8" stroke-width="2"/>
  <line x1="350" y1="70" x2="230" y2="150" stroke="#1a73e8" stroke-width="2"/>
  <line x1="350" y1="70" x2="390" y2="150" stroke="#1a73e8" stroke-width="2"/>
  <line x1="350" y1="70" x2="550" y2="150" stroke="#1a73e8" stroke-width="2"/>
  <line x1="350" y1="70" x2="630" y2="150" stroke="#1a73e8" stroke-width="2"/>

  <!-- BEC -->
  <rect x="10" y="150" width="130" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="75" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">Business Email</text>
  <text x="75" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">Compromise</text>
  <text x="75" y="212" text-anchor="middle" font-size="11" fill="#5f6368">Impersonates a known source</text>

  <!-- Spear phishing -->
  <rect x="170" y="150" width="130" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="235" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">Spear Phishing</text>
  <text x="235" y="205" text-anchor="middle" font-size="11" fill="#5f6368">Targets a specific user</text>

  <!-- Whaling -->
  <rect x="330" y="150" width="120" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="390" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">Whaling</text>
  <text x="390" y="205" text-anchor="middle" font-size="11" fill="#5f6368">Targets executives</text>

  <!-- Vishing -->
  <rect x="480" y="150" width="130" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="545" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">Vishing</text>
  <text x="545" y="205" text-anchor="middle" font-size="11" fill="#5f6368">Uses voice communication</text>

  <!-- Smishing -->
  <rect x="560" y="240" width="130" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="625" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">Smishing</text>
  <text x="625" y="290" text-anchor="middle" font-size="11" fill="#5f6368">Uses text messages</text>
  <line x1="350" y1="70" x2="625" y2="240" stroke="#1a73e8" stroke-width="2"/>
</svg>
